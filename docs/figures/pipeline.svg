<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-label="Pipeline: a static model suspects a regex, then the real engine proves it. Parse, build an NFA, find ambiguity and an attack string; then run the attack on real Node, Python or Ruby at growing lengths and read the verdict from the measured timings.">
  <rect x="0.5" y="0.5" width="879" height="329" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#0b0b0b">The honest split: the model suspects, the engine proves</text>
  <text x="24" y="49" font-size="12" fill="#52514e">A finding is never "this looks dangerous" — it is "this took this long on your engine, with this input".</text>

  <!-- Phase bands -->
  <text x="24" y="80" font-size="11" font-weight="700" letter-spacing="0.6" fill="#2a78d6">STATIC MODEL — SUSPECTS</text>
  <text x="560" y="80" font-size="11" font-weight="700" letter-spacing="0.6" fill="#d95926">REAL ENGINE — PROVES</text>

  <!-- divider -->
  <line x1="524" y1="64" x2="524" y2="300" stroke="#e1e0d9" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- arrow marker -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#898781" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- STATIC boxes: x positions 24,150,276,402 (width 108, height 70, top 96) -->
  <!-- box 1: a regex -->
  <rect x="24" y="96" width="108" height="70" rx="7" fill="#f2f7fd" stroke="#cfe0f5"/>
  <rect x="24" y="96" width="4" height="70" rx="2" fill="#2a78d6"/>
  <text x="78" y="126" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">a regex</text>
  <text x="78" y="144" font-size="10.5" text-anchor="middle" fill="#52514e">/(a+)+$/</text>

  <!-- box 2: parse -->
  <rect x="150" y="96" width="108" height="70" rx="7" fill="#f2f7fd" stroke="#cfe0f5"/>
  <rect x="150" y="96" width="4" height="70" rx="2" fill="#2a78d6"/>
  <text x="204" y="122" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">parse</text>
  <text x="204" y="140" font-size="10" text-anchor="middle" fill="#52514e">JS · Python</text>
  <text x="204" y="153" font-size="10" text-anchor="middle" fill="#52514e">· Ruby</text>

  <!-- box 3: NFA -->
  <rect x="276" y="96" width="108" height="70" rx="7" fill="#f2f7fd" stroke="#cfe0f5"/>
  <rect x="276" y="96" width="4" height="70" rx="2" fill="#2a78d6"/>
  <text x="330" y="122" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">NFA model</text>
  <text x="330" y="140" font-size="10" text-anchor="middle" fill="#52514e">step-counted</text>
  <text x="330" y="153" font-size="10" text-anchor="middle" fill="#52514e">backtracking</text>

  <!-- box 4: ambiguity -->
  <rect x="402" y="96" width="108" height="70" rx="7" fill="#f2f7fd" stroke="#cfe0f5"/>
  <rect x="402" y="96" width="4" height="70" rx="2" fill="#2a78d6"/>
  <text x="456" y="118" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">ambiguity</text>
  <text x="456" y="135" font-size="10" text-anchor="middle" fill="#52514e">exp / poly</text>
  <text x="456" y="149" font-size="10" text-anchor="middle" fill="#52514e">→ attack string</text>

  <!-- ENGINE boxes: 560 and 718 (width 146, height 70) -->
  <rect x="560" y="96" width="146" height="70" rx="7" fill="#fdf3ee" stroke="#f6d9c8"/>
  <rect x="560" y="96" width="4" height="70" rx="2" fill="#eb6834"/>
  <text x="633" y="120" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">run the attack</text>
  <text x="633" y="138" font-size="10" text-anchor="middle" fill="#52514e">real Node / Python /</text>
  <text x="633" y="151" font-size="10" text-anchor="middle" fill="#52514e">Ruby, growing lengths</text>

  <rect x="718" y="96" width="138" height="70" rx="7" fill="#fdf3ee" stroke="#f6d9c8"/>
  <rect x="718" y="96" width="4" height="70" rx="2" fill="#eb6834"/>
  <text x="787" y="120" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">verdict</text>
  <text x="787" y="138" font-size="10" text-anchor="middle" fill="#52514e">from measured</text>
  <text x="787" y="151" font-size="10" text-anchor="middle" fill="#52514e">wall-clock timings</text>

  <!-- arrows between boxes -->
  <line x1="132" y1="131" x2="148" y2="131" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="258" y1="131" x2="274" y2="131" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="384" y1="131" x2="400" y2="131" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="510" y1="131" x2="558" y2="131" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="706" y1="131" x2="716" y2="131" stroke="#898781" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- footer note: the Ruby split -->
  <text x="24" y="206" font-size="11.5" fill="#52514e">Same regex, different engines: <tspan font-weight="600" fill="#0b0b0b">(a+)+$</tspan> is proven exponential on Node and CPython, but Ruby 3.2+ memoizes and</text>
  <text x="24" y="223" font-size="11.5" fill="#52514e">does not slow down — so the tool reports it as <tspan font-weight="600" fill="#0b0b0b">not reproduced</tspan> there. A shape-only linter cannot make that distinction.</text>

  <!-- CLI strip -->
  <rect x="24" y="246" width="832" height="58" rx="7" fill="#f6f6f3" stroke="#e1e0d9"/>
  <text x="40" y="270" font-size="11" fill="#52514e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ redos-proof scan '(a+)+$'</text>
  <text x="40" y="291" font-size="11" fill="#0b0b0b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  real engine (Node): <tspan fill="#d95926" font-weight="600">PROVEN EXPONENTIAL</tspan>  —  25 chars <tspan fill="#0b0b0b">1225.5 ms</tspan>,  29 chars <tspan fill="#d95926">timed out</tspan></text>
</svg>
